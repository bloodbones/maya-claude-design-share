<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maya iOS Claude Design - Search and Queue</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eee9e1;
        color: #211a16;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 12px 48px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 20px;
        color: #6f675f;
        font-size: 15px;
      }
      a {
        color: #8c3f27;
        font-weight: 600;
      }
      section {
        margin: 24px 0 36px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border: 1px solid rgba(40, 31, 25, 0.12);
        background: #eee9e1;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0 4px;
      }
      .links a {
        display: inline-block;
        padding: 10px 12px;
        border: 1px solid rgba(140, 63, 39, 0.25);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.58);
        text-decoration: none;
      }

  <body>
    <main>
      <h1>Maya iOS Claude Design</h1>
      <p>Search and queue UX screenshots from the Claude Design export.</p>
      <div class="links">
        <a href="search.png">Open Search PNG</a>
        <a href="queue.png">Open Queue PNG</a>
        <a href="full.png">Open Full Board PNG</a>
        <a href="claude-board.html">Open Original Claude HTML</a>
      </div>
      <section>
        <h2>Search</h2>
        <img src="search.png" alt="Claude Design search UX board">
      </section>
      <section>
        <h2>Queue</h2>
        <img src="queue.png" alt="Claude Design message queue UX board">
      </section>
    </main>
